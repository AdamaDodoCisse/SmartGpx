name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    name: QA (cs-fixer, PHPStan, PHPUnit)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Tests run against SQLite (see config/packages/doctrine.yaml's when@test block and
    # CLAUDE.md), not MySQL — no DATABASE_URL override needed, .env.test's sqlite:/// path
    # takes over from APP_ENV=test alone. Redis stays: the rate limiter (login throttling etc.)
    # is backed by it even in test, to persist state across the test client's kernel reboots.
    env:
      APP_ENV: test
      REDIS_URL: "redis://127.0.0.1:6379"
      MAILER_DSN: "null://null"

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, mbstring, pdo_sqlite, redis
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: assets/app/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('assets/app/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install frontend dependencies
        working-directory: assets/app
        run: npm ci

      - name: Type-check frontend
        working-directory: assets/app
        run: npm run typecheck

      - name: Build frontend
        working-directory: assets/app
        run: npm run build

      - name: Create test database schema
        run: php bin/console doctrine:schema:update --force --env=test

      - name: Coding standard (php-cs-fixer)
        run: composer cs-check

      - name: Warm the dev container (needed by phpstan-symfony)
        run: php bin/console cache:warmup --env=dev

      - name: Static analysis (PHPStan)
        run: composer stan

      - name: Tests (PHPUnit)
        run: composer test
