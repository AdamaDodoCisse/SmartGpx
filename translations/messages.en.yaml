        cta: 'Full pricing details →'
    guide:
        eyebrow: 'THE GUIDE'
        title: "Why Google Maps doesn't export a GPX file."
        body_1: "A Google Maps route is just a link — not a file your GPS can read. Getting a real track out of it means recomputing the route point by point, the same way Google's own navigation does. That routing computation is the one part of SmartGPX that needs a paid credit; every other tool on this page runs free, in your browser."
        body_2: "The result is a plain, open GPX file — the format Garmin, Wahoo, OsmAnd, Locus Map and most GPS tools already read natively, so importing it back onto your device just works."
        cta: 'Read the full step-by-step guide →'
    faq:
        title: 'Frequently asked questions'
        q_gpx_title: 'What is a GPX file?'
        q_gpx_body: 'GPX (GPS Exchange Format) is a standard, text-based file format for storing routes, tracks and waypoints. Most GPS devices and navigation apps can read it.'
        q_convert_title: 'How do I convert a Google Maps route to GPX?'
        q_convert_body: 'Paste your Google Maps directions link into SmartGPX and click Convert to GPX. Your file downloads in seconds.'
        q_garmin_title: 'Can I use SmartGPX with Garmin?'
        q_garmin_body: 'Yes. GPX is a format Garmin devices and Garmin Connect support, so you can load a SmartGPX file directly onto compatible Garmin devices.'
        q_wahoo_title: 'Does SmartGPX work with Wahoo?'
        q_wahoo_body: 'Yes. Wahoo bike computers accept GPX route files.'
        q_gpx_to_maps_title: 'Can I convert GPX back to Google Maps?'
        q_gpx_to_maps_body: 'Yes — the free GPX → Google Maps tool turns a GPX track into a Google Maps directions link.'
        q_credits_expire_title: 'Do my credits expire?'
        q_credits_expire_body: 'No. Credits are purchased once and stay on your account until you use them.'
        q_subscription_title: 'Do I need a subscription?'
        q_subscription_body: 'No. SmartGPX has no subscription — you buy credits once and use them whenever you convert a route.'
        q_privacy_title: 'Are my GPX files uploaded to SmartGPX?'
        q_privacy_body: 'Only if you use Google Maps → GPX, which needs to contact a routing service. Every other tool (viewer, simplify, merge, format converters) runs entirely in your browser — those files never leave your device.'
        q_chrome_title: 'Can I use SmartGPX from Chrome?'
        q_chrome_body: 'Yes. The SmartGPX Chrome extension lets you export a GPX file straight from a Google Maps tab, without copying a link.'
    final_cta:
        title: 'Your route is already planned.'
        subtitle: 'Now take it with you.'
        primary_cta: 'Convert Google Maps to GPX'
