        intro: 'Des guides pratiques sur les formats de fichiers GPS et comment les convertir.'
    gpx_vs_kml:
        meta_title: 'GPX ou KML : quel format choisir ?'
        meta_description: "Comparez les formats GPX et KML : leurs usages, les applications GPS compatibles, et comment convertir de l'un à l'autre."
        title: 'GPX ou KML : quel format choisir ?'
        intro: "Le GPX est conçu pour les appareils GPS et les applications de suivi ; le KML pour Google Earth et la cartographie. Voici comment les distinguer, et comment les convertir."
    gpx_vs_tcx:
        meta_title: 'GPX ou TCX : quel format pour votre appareil GPS ?'
        meta_description: "GPX et TCX stockent tous deux des traces GPS, mais TCX ajoute des données d'entraînement comme la fréquence cardiaque et les tours. Découvrez la différence."
        title: 'GPX ou TCX : quelle différence ?'
        intro: "Le TCX étend le GPX avec des données d'entraînement : fréquence cardiaque, cadence, tours. Voici quand utiliser l'un plutôt que l'autre."
    gpx_vs_fit:
        meta_title: 'GPX ou FIT : comprendre la différence'
        meta_description: "Le FIT est le format binaire compact de Garmin pour les données d'activité ; le GPX est le standard universel et lisible pour les traces GPS. Découvrez quand utiliser chacun."
        title: 'GPX ou FIT : comprendre la différence'
        intro: "Le FIT est un format binaire compact conçu pour les appareils sportifs ; le GPX est un standard universel en texte que la plupart des logiciels GPS lisent. Voici la comparaison."
    gpx_vs_geojson:
        meta_title: 'GPX ou GeoJSON : cartes web ou appareils GPS ?'
        meta_description: "Le GeoJSON est conçu pour les cartes web et les développeurs ; le GPX pour les appareils GPS et les applications outdoor. Découvrez la différence."
        title: 'GPX ou GeoJSON : quelle différence ?'
        intro: "Le GeoJSON est le standard des bibliothèques de cartographie web ; le GPX est le standard des appareils GPS et des applications de randonnée ou de vélo. Voici quand utiliser chacun."
    google_maps_to_gpx:
        meta_title: 'Comment convertir un itinéraire Google Maps en GPX'
        meta_description: "Étape par étape : transformez un itinéraire Google Maps en fichier GPX utilisable sur un Garmin, un Wahoo ou toute application GPS, en quelques secondes."
        title: 'Comment convertir un itinéraire Google Maps en GPX'
        intro: "Vous avez préparé un itinéraire sur Google Maps mais avez besoin de l'avoir sur votre GPS ? Voici comment le transformer en fichier GPX standard, rapidement."
    kmz:
        meta_title: "Qu'est-ce qu'un fichier KMZ et comment le convertir en GPX ?"
        meta_description: "Le KMZ est un fichier KML compressé, exporté par Google Earth ou Google My Maps. Découvrez ce qu'il contient et comment le convertir en GPX."
        title: "Qu'est-ce qu'un fichier KMZ ?"
        intro: "Un KMZ est simplement un fichier KML (le format de Google Earth) compressé, souvent avec des icônes ou des images. Voici ce que cela implique pour le convertir en GPX."
    simplify_track:
        meta_title: 'Comment simplifier une trace GPS sans perdre sa forme'
        meta_description: "Découvrez comment fonctionne la simplification de trace (Ramer-Douglas-Peucker) et comment réduire le nombre de points d'un GPX tout en gardant sa forme."
        title: 'Comment simplifier une trace GPS sans perdre sa forme'
        intro: "Un GPX enregistré chaque seconde peut contenir des milliers de points. Voici comment la simplification réduit ce nombre sans déformer l'itinéraire."
    merge_tracks:
        meta_title: 'Comment fusionner plusieurs traces GPX en un seul fichier'
        meta_description: "Combinez plusieurs fichiers GPX enregistrés sur plusieurs jours ou segments en une seule trace ou un seul fichier, directement dans votre navigateur."
        title: 'Comment fusionner plusieurs traces GPX en un seul fichier'
        intro: "Vous avez enregistré un voyage de plusieurs jours en plusieurs fichiers GPX ? Voici comment les combiner en une seule trace, ou en un seul fichier à segments distincts."
    google_maps_to_garmin:
        meta_title: 'Google Maps vers Garmin : convertissez votre itinéraire en GPX | SmartGPX'
        meta_description: "Convertissez un itinéraire Google Maps en GPX pour Garmin. Collez votre itinéraire dans SmartGPX, téléchargez le GPX, puis importez-le comme parcours dans Garmin Connect."
        title: 'Comment envoyer un itinéraire Google Maps vers Garmin'
        intro: "Google Maps n'exporte pas directement un itinéraire vers Garmin. Convertissez-le d'abord en GPX, puis chargez-le comme parcours sur votre appareil."
        convert_cta: 'Convertir votre itinéraire pour Garmin'
        step_1_title: 'Préparez votre itinéraire dans Google Maps'
        step_1_body: 'Renseignez le départ, la destination et les étapes éventuelles, comme d’habitude.'
        step_2_title: 'Copiez le lien de l’itinéraire'
        step_2_body: "Utilisez le bouton « Partager » de Google Maps, ou copiez l'URL depuis la barre d'adresse."
        step_3_title: 'Collez-le dans SmartGPX'
        step_3_body: 'Déposez le lien dans le convertisseur ci-dessous et lancez la conversion.'
        step_4_title: 'Téléchargez le fichier GPX'
        step_4_body: "SmartGPX renvoie un fichier GPX standard, calculé à partir de l'itinéraire réel."
        step_5_title: 'Importez-le dans Garmin Connect'
        step_5_body: 'Importez le GPX comme parcours dans Garmin Connect, puis envoyez-le vers votre montre ou votre Edge.'
        garmin_specifics_title: 'Faire arriver le fichier sur votre Garmin'
        limitations_title: 'À savoir'
        faq:
            q_direct_export_title: 'Google Maps peut-il exporter directement vers Garmin ?'
            q_direct_export_body: "Non. Google Maps n'a pas d'export natif vers Garmin. Il faut d'abord convertir l'itinéraire en fichier GPX, ce que fait SmartGPX."
            q_convert_title: 'Comment convertir un itinéraire Google Maps en GPX pour Garmin ?'
            q_convert_body: 'Collez le lien de l’itinéraire Google Maps dans le convertisseur de cette page, téléchargez le fichier GPX obtenu, puis importez-le dans Garmin Connect.'
            q_connect_import_title: 'Puis-je importer des fichiers GPX dans Garmin Connect ?'
            q_connect_import_body: 'Oui. Garmin Connect permet d’importer un fichier GPX comme parcours, puis d’envoyer ce parcours vers une montre ou un Edge appairé.'
            q_edge_title: 'Puis-je utiliser cet itinéraire avec un Garmin Edge ?'
            q_edge_body: 'Oui. Les compteurs Edge prennent en charge les parcours synchronisés depuis Garmin Connect, où le GPX téléchargé ici est importé.'
            q_zumo_title: 'Puis-je l’utiliser avec un Garmin Zumo ?'
