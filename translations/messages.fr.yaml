    guide:
        eyebrow: 'LE GUIDE'
        title: "Pourquoi Google Maps n'exporte pas de fichier GPX."
        body_1: "Un itinéraire Google Maps n'est qu'un lien, pas un fichier que votre GPS peut lire. En extraire une vraie trace suppose de recalculer l'itinéraire point par point, comme le fait la navigation de Google elle-même. Ce calcul d'itinéraire réel est la seule partie de SmartGPX qui nécessite un crédit payant ; tous les autres outils de cette page sont gratuits et s'exécutent dans votre navigateur."
        body_2: "Le résultat est un fichier GPX ouvert et standard : le format que Garmin, Wahoo, OsmAnd, Locus Map et la plupart des outils GPS lisent déjà nativement, donc l'import sur votre appareil fonctionne directement."
        cta: 'Lire le guide complet →'
    faq:
        title: 'Questions fréquentes'
        q_gpx_title: "Qu'est-ce qu'un fichier GPX ?"
        q_gpx_body: "Le GPX (GPS Exchange Format) est un format de fichier standard, en texte, pour stocker des itinéraires, traces et points d'intérêt. La plupart des appareils GPS et applications de navigation savent le lire."
        q_convert_title: 'Comment convertir un itinéraire Google Maps en GPX ?'
        q_convert_body: 'Collez votre lien d’itinéraire Google Maps dans SmartGPX et cliquez sur Convertir en GPX. Votre fichier se télécharge en quelques secondes.'
        q_garmin_title: 'Puis-je utiliser SmartGPX avec Garmin ?'
        q_garmin_body: 'Oui. Le GPX est un format pris en charge par les appareils Garmin et Garmin Connect : vous pouvez charger un fichier SmartGPX directement sur un appareil Garmin compatible.'
        q_wahoo_title: 'SmartGPX fonctionne-t-il avec Wahoo ?'
        q_wahoo_body: 'Oui. Les compteurs de vélo Wahoo acceptent les fichiers d’itinéraire GPX.'
        q_osmand_title: 'Puis-je utiliser un itinéraire Google Maps dans OsmAnd ?'
        q_osmand_body: 'Oui. OsmAnd navigue à partir de traces GPX, exactement ce que SmartGPX génère depuis un itinéraire Google Maps.'
        q_gpx_to_maps_title: 'Puis-je reconvertir un GPX en Google Maps ?'
        q_gpx_to_maps_body: "Oui. L'outil gratuit GPX → Google Maps transforme une trace GPX en lien d'itinéraire Google Maps."
        q_credits_expire_title: 'Mes crédits expirent-ils ?'
        q_credits_expire_body: "Non. Les crédits sont achetés une fois et restent sur votre compte jusqu'à ce que vous les utilisiez."
        q_subscription_title: "Ai-je besoin d'un abonnement ?"
        q_subscription_body: "Non. SmartGPX ne propose pas d'abonnement : vous achetez des crédits une fois et les utilisez quand vous convertissez un itinéraire."
        q_privacy_title: 'Mes fichiers GPX sont-ils envoyés à SmartGPX ?'
        q_privacy_body: "Seulement si vous utilisez Google Maps → GPX, qui doit contacter un service de calcul d'itinéraire. Tous les autres outils (visionneuse, simplification, fusion, convertisseurs de formats) s'exécutent entièrement dans votre navigateur. Ces fichiers ne quittent jamais votre appareil."
        q_chrome_title: 'Puis-je utiliser SmartGPX depuis Chrome ?'
        q_chrome_body: "Oui. L'extension Chrome SmartGPX permet d'exporter un fichier GPX directement depuis un onglet Google Maps, sans copier de lien."
    final_cta:
        title: 'Votre itinéraire est déjà prêt.'
        subtitle: 'Emportez-le maintenant.'
        primary_cta: 'Convertir Google Maps en GPX'
